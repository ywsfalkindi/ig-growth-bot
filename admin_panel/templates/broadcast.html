{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-broadcast"></i> إرسال رسالة للجميع</h2>

<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="alert alert-warning d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>
                        <strong>تحذير:</strong> استخدم هذه الميزة بحذر شديد. إرسال رسائل جماعية بشكل متكرر قد يعرض حساب البوت الخاص بك لخطر التقييد من قبل انستجرام.
                    </div>
                </div>

                <form action="{{ url_for('broadcast_message') }}" method="post">
                    <div class="mb-3">
                        <label for="message" class="form-label fw-bold">نص الرسالة</label>
                        <textarea name="message" id="message" class="form-control" rows="6" required placeholder="اكتب هنا رسالتك التي سيتم إرسالها إلى كل المستخدمين..."></textarea>
                    </div>
                    <div class="text-end mt-4">
                        <button type="submit" class="btn btn-primary btn-lg" onclick="return confirm('هل أنت متأكد من إرسال هذه الرسالة إلى كل المستخدمين؟ لا يمكن التراجع عن هذا الإجراء.');">
                            <i class="bi bi-send-fill"></i> إرسال الآن للجميع
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
