{% extends "base.html" %}
{% block content %}
<h2>إرسال رسالة للجميع</h2>
<p class="text-muted">تحذير: استخدم هذه الميزة بحذر. إرسال الرسائل لعدد كبير من المستخدمين قد يعرض حسابك للخطر.</p>
<form action="{{ url_for('broadcast_message') }}" method="post">
  <div class="mb-3">
    <label for="message" class="form-label">نص الرسالة</label>
    <textarea name="message" id="message" class="form-control" rows="5" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary" onclick="return confirm('هل أنت متأكد من إرسال هذه الرسالة إلى كل المستخدمين؟');">إرسال الآن</button>
</form>
{% endblock %}
