{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-patch-check-fill"></i> إدارة الأكواد ({{ codes|length }})</h2>

<div class="card shadow-sm">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h5 class="mb-0">إنشاء دفعة جديدة من الأكواد</h5>
        <form action="{{ url_for('manage_codes') }}" method="post" class="d-flex gap-2">
            <input type="number" name="count" class="form-control" value="50" style="width: 120px;" title="عدد الأكواد المراد إنشاؤها">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-plus-circle-fill"></i> إنشاء الآن
            </button>
        </form>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr class="table-dark">
                        <th style="width: 70%;">الكود</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody>
                {% for code in codes %}
                    <tr>
                        <td>
                            <code class="fs-5"><strong>{{ code.code_value }}</strong></code>
                        </td>
                        <td>
                            {% if code.is_used %}
                                <span class="badge bg-secondary">مستخدم</span>
                            {% else %}
                                <span class="badge bg-success">متاح</span>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
