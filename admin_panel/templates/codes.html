{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-patch-check-fill"></i> إدارة الأكواد ({{ codes|length }})</h2>

<div class="card">
    <div class="card-header bg-light d-flex justify-content-between align-items-center">
        <h5 class="mb-0">إنشاء دفعة جديدة من الأكواد</h5>
        <form action="{{ url_for('manage_codes') }}" method="post" class="d-flex gap-2">
            <input type="number" name="count" class="form-control" value="50" style="width: 120px;" title="عدد الأكواد المراد إنشاؤها">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-plus-circle-fill"></i> إنشاء الآن
            </button>
        </form>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="py-3 px-4">الكود</th>
                        <th class="py-3 px-4">الحالة</th>
                        <th class="py-3 px-4">إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                {% for code in codes %}
                    <tr>
                        <td class="p-4">
                            <code class="fs-5"><strong>{{ code.code_value }}</strong></code>
                        </td>
                        <td class="p-4">
                            {% if code.is_used %}
                                <span class="badge bg-secondary-subtle text-secondary-emphasis">مستخدم</span>
                            {% else %}
                                <span class="badge bg-success-subtle text-success-emphasis">متاح</span>
                            {% endif %}
                        </td>
                        <td class="p-4 d-flex gap-2">
                            {% if code.is_used %}
                                <form action="{{ url_for('reactivate_code', code_id=code.id) }}" method="post" onsubmit="return confirm('هل تريد إعادة تفعيل هذا الكود ليصبح متاحاً للاستخدام مرة أخرى؟');">
                                    <button type="submit" class="btn btn-sm btn-outline-success" title="إعادة تفعيل الكود">
                                        <i class="bi bi-arrow-counterclockwise"></i>
                                    </button>
                                </form>
                            {% endif %}
                            <form action="{{ url_for('delete_code', code_id=code.id) }}" method="post" onsubmit="return confirm('هل أنت متأكد من حذف هذا الكود نهائياً؟');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="حذف الكود">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
