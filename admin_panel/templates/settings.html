{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">الإعدادات العامة للبوت</h2>
<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" role="switch" id="botPaused" name="BOT_PAUSED" {% if settings.BOT_PAUSED %}checked{% endif %}>
                <label class="form-check-label" for="botPaused">إيقاف البوت مؤقتًا (لن يستجيب لأي رسائل)</label>
            </div>
            <hr>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="pointsPerTask" class="form-label">النقاط لكل مهمة ناجحة</label>
                    <input type="number" class="form-control" id="pointsPerTask" name="POINTS_PER_TASK" value="{{ settings.POINTS_PER_TASK }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="followersPerPoint" class="form-label">عدد المتابعين لكل نقطة</label>
                    <input type="number" class="form-control" id="followersPerPoint" name="FOLLOWERS_PER_POINT" value="{{ settings.FOLLOWERS_PER_POINT }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="mysteryBoxCost" class="form-label">تكلفة صندوق الغموض (بالنقاط)</label>
                    <input type="number" class="form-control" id="mysteryBoxCost" name="MYSTERY_BOX_COST" value="{{ settings.MYSTERY_BOX_COST }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="tasksForLevelUp" class="form-label">عدد المهام اللازمة للترقية</label>
                    <input type="number" class="form-control" id="tasksForLevelUp" name="TASKS_FOR_LEVEL_UP" value="{{ settings.TASKS_FOR_LEVEL_UP }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">حفظ الإعدادات</button>
        </form>
    </div>
</div>
{% endblock %}
