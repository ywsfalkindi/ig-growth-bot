{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-activity"></i> السجل المباشر للبوت</h2>

<div class="card shadow-sm">
    <div class="card-header">
        <h5 class="mb-0">مراقبة حية (Live Log Tailing)</h5>
    </div>
    <div class="card-body p-0">
        <pre id="log-output" style="height: 600px; overflow-y: scroll; background-color: #1a202c; color: #cbd5e0; padding: 1.5rem; margin: 0; border-radius: 0 0 12px 12px; font-family: 'Courier New', Courier, monospace; direction: ltr; text-align: left;"></pre>
    </div>
</div>
{% endblock %}
